name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # Runs once release-please has merged a release PR and created the release: builds the package
  # files and attaches them, which is what the VCC listing reads.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Read package.json
        id: pkg
        run: |
          echo "name=$(jq -r .name package.json)" >> $GITHUB_OUTPUT
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      # The package as VCC installs it: no tests, no design notes, no repository files. It sits under
      # Packages/<name> so the unitypackage imports into the Packages folder.
      - name: Stage The Package
        run: |
          stage="$RUNNER_TEMP/stage/Packages/${{ steps.pkg.outputs.name }}"
          mkdir -p "$stage"
          rsync -a --exclude '.git' --exclude '.github' --exclude '.gitignore' --exclude '.gitattributes' \
            --exclude 'Tests' --exclude 'Tests.meta' --exclude 'Docs~' ./ "$stage/"

      - name: Create Package Zip
        run: |
          cd "$RUNNER_TEMP/stage/Packages/${{ steps.pkg.outputs.name }}"
          zip -r -q "$GITHUB_WORKSPACE/${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.zip" .

      - name: Track Package Meta Files
        run: |
          cd "$RUNNER_TEMP/stage"
          find "Packages/${{ steps.pkg.outputs.name }}" -name '*.meta' > metaList

      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          working-folder: ${{ runner.temp }}/stage
          package-path: ${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.unitypackage
          include-files: metaList

      - name: Attach Files To Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.zip" \
            "$RUNNER_TEMP/stage/${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.unitypackage" \
            package.json --clobber

      # With a token that may run workflows on DocMeVR/vpm the listing updates right away; without
      # one its hourly schedule picks the release up.
      - name: Rebuild The VCC Listing
        env:
          TOKEN: ${{ secrets.VPM_LISTING_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/DocMeVR/vpm/dispatches -d '{"event_type":"package-released"}'
          else
            echo "VPM_LISTING_TOKEN is not set: the listing rebuilds on its hourly schedule."
          fi
